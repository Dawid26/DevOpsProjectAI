name: CI tests
on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install test dependencies
        run: python -m pip install -r api/requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q api/app
      - name: Run unit/API tests
        env:
          PYTHONPATH: api
        run: python -m pytest -q api/tests

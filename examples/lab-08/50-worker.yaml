apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: incidentflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: incidentflow:lab08
          imagePullPolicy: IfNotPresent
          command: ["rq", "worker", "--url", "redis://redis:6379/0", "--with-scheduler", "notifications"]
          envFrom:
            - configMapRef:
                name: incidentflow-config
            - secretRef:
                name: incidentflow-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi

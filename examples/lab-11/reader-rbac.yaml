apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-reader
  namespace: incidentflow
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: lab-reader
  namespace: incidentflow
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lab-reader
  namespace: incidentflow
subjects:
  - kind: ServiceAccount
    name: lab-reader
    namespace: incidentflow
roleRef:
  kind: Role
  name: lab-reader
  apiGroup: rbac.authorization.k8s.io
